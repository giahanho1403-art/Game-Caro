<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caro Game</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(
        135deg,
        #ffdce8,
        #dff4ff,
        #eee5ff
    );
    color: #62566b;
    padding: 20px;
}
.container {
    width: 100%;
    max-width: 850px;
    background: rgba(255,255,255,0.82);
    padding: 30px;
    border-radius: 30px;
    box-shadow:
        0 15px 40px rgba(120,100,140,0.18);
    text-align: center;
}
h1 {
    font-size: 42px;
    color: #d477a4;
    margin-bottom: 10px;
}
.subtitle {
    color: #93859b;
    margin-bottom: 25px;
}
/* ================= MENU ================= */
#menu {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
}
.mode-btn {
    width: 280px;
    padding: 16px;
    border: none;
    border-radius: 18px;
    font-size: 18px;
    font-weight: bold;
    color: #62566b;
    cursor: pointer;
    transition: 0.2s;
}
.mode-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 18px rgba(120,100,140,0.15);
}
.player-btn {
    background: #ffd1e2;
}
.ai-btn {
    background: #cfeeff;
}
/* ================= GAME ================= */
#game {
    display: none;
}
.info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fff2f8;
    padding: 14px 18px;
    border-radius: 16px;
    margin-bottom: 18px;
    font-weight: bold;
}
#turn {
    color: #d477a4;
}
/* ================= BOARD ================= */
.board-container {
    width: 100%;
    overflow-x: auto;
    padding: 5px;
}
#board {
    display: grid;
    grid-template-columns: repeat(15, 38px);
    grid-template-rows: repeat(15, 38px);
    gap: 2px;
    width: max-content;
    margin: auto;
    padding: 5px;
    background: #d6c6dc;
    border-radius: 15px;
}
.cell {
    width: 38px;
    height: 38px;
    border: none;
    background: #fffafd;
    cursor: pointer;
    font-size: 25px;
    font-weight: bold;
    border-radius: 4px;
    transition: 0.15s;
}
.cell:hover {
    background: #ffe7f1;
}
.cell.x {
    color: #e58bad;
}
.cell.o {
    color: #78b7dc;
}
/* ================= RESULT ================= */
#result {
    display: none;
    margin-top: 20px;
    padding: 18px;
    border-radius: 18px;
    font-size: 25px;
    font-weight: bold;
    background: #fff1f7;
    color: #d477a4;
}
/* ================= BUTTON ================= */
.buttons {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 18px;
    flex-wrap: wrap;
}
.control-btn {
    border: none;
    padding: 12px 22px;
    border-radius: 15px;
    background: #e7ddff;
    color: #62566b;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}
.control-btn:hover {
    transform: scale(1.04);
}
#message {
    margin-top: 12px;
    min-height: 25px;
    color: #9b7195;
    font-weight: bold;
}
/* ================= MOBILE ================= */
@media (max-width: 600px) {
    .container {
        padding: 18px;
    }
    h1 {
        font-size: 32px;
    }
    #board {
        grid-template-columns: repeat(15, 30px);
        grid-template-rows: repeat(15, 30px);
    }
    .cell {
        width: 30px;
        height: 30px;
        font-size: 20px;
    }
    .info {
        font-size: 14px;
    }
}
</style>
</head>
<body>
<div class="container">
    <h1>Caro Game</h1>
    <p class="subtitle">
        Chọn chế độ chơi
    </p>
    <!-- ================= MENU ================= -->
    <div id="menu">
        <button
            class="mode-btn player-btn"
            onclick="startGame('pvp')">
            2 người chơi
        </button>
        <button
            class="mode-btn ai-btn"
            onclick="startGame('ai')">
            Chơi với AI
        </button>
    </div>
    <!-- ================= GAME ================= -->
    <div id="game">
        <div class="info">
            <span>
                Chế độ:
                <span id="modeText"></span>
            </span>
            <span id="turn">
                Lượt: X
            </span>
        </div>
        <div class="board-container">
            <div id="board"></div>
        </div>
        <div id="message"></div>
        <div id="result"></div>
        <div class="buttons">
            <button
                class="control-btn"
                onclick="resetGame()">
                Chơi lại
            </button>
            <button
                class="control-btn"
                onclick="backToMenu()">
                Menu
            </button>
        </div>
    </div>
</div>
<script>
/* =========================
        GAME SETTINGS
========================= */
const SIZE = 15;
let board = [];
let currentPlayer = "X";
let gameMode = "";
let gameOver = false;
/* =========================
        ELEMENTS
========================= */
const boardElement =
    document.getElementById("board");
const menu =
    document.getElementById("menu");
const game =
    document.getElementById("game");
const turnText =
    document.getElementById("turn");
const modeText =
    document.getElementById("modeText");
const message =
    document.getElementById("message");
const result =
    document.getElementById("result");
/* =========================
        START GAME
========================= */
function startGame(mode) {
    gameMode = mode;
    menu.style.display = "none";
    game.style.display = "block";
    if (mode === "pvp") {
        modeText.textContent =
            "2 người chơi";
    } else {
        modeText.textContent =
            "Chơi với AI";
    }
    resetGame();
}
/* =========================
        RESET GAME
========================= */
function resetGame() {
    board = [];
    for (let i = 0; i < SIZE; i++) {
        board[i] =
            Array(SIZE).fill("");
    }
    currentPlayer = "X";
    gameOver = false;
    message.textContent = "";
    result.style.display = "none";
    updateTurn();
    drawBoard();
}
/* =========================
        DRAW BOARD
========================= */
function drawBoard() {
    boardElement.innerHTML = "";
    for (let row = 0; row < SIZE; row++) {
        for (let col = 0; col < SIZE; col++) {
            const cell =
                document.createElement("button");
            cell.className = "cell";
            if (board[row][col] === "X") {
                cell.textContent = "X";
                cell.classList.add("x");
            }
            else if (board[row][col] === "O") {
                cell.textContent = "O";
                cell.classList.add("o");
            }
            cell.onclick = function() {
                playerMove(row, col);
            };
            boardElement.appendChild(cell);
        }
    }
}
/* =========================
        PLAYER MOVE
========================= */
function playerMove(row, col) {
    if (gameOver) return;
    if (board[row][col] !== "") return;
    /* AI đang suy nghĩ */
    if (
        gameMode === "ai" &&
        currentPlayer === "O"
    ) {
        return;
    }
    makeMove(row, col, currentPlayer);
    if (gameOver) return;
    /* AI */
    if (
        gameMode === "ai" &&
        currentPlayer === "O"
    ) {
        message.textContent =
            "AI đang suy nghĩ...";
        setTimeout(function() {
            aiMove();
        }, 400);
    }
}
/* =========================
        MAKE MOVE
========================= */
function makeMove(row, col, player) {
    board[row][col] = player;
    drawBoard();
    /* KIỂM TRA THẮNG */
    if (checkWin(row, col, player)) {
        gameOver = true;
        showResult(player);
        return;
    }
    /* KIỂM TRA HÒA */
    if (checkDraw()) {
        gameOver = true;
        result.textContent = "HÒA!";
        result.style.display = "block";
        turnText.textContent = "Kết thúc";
        message.textContent = "";
        return;
    }
    /* Đổi lượt */
    currentPlayer =
        currentPlayer === "X"
        ? "O"
        : "X";
    updateTurn();
    message.textContent = "";
}
/* =========================
        SHOW RESULT
========================= */
function showResult(player) {
    result.style.display = "block";
    if (gameMode === "ai") {
        if (player === "X") {
            result.textContent =
                "BẠN THẮNG!";
        } else {
            result.textContent =
                "BẠN THUA!";
        }
    }
    else {
        result.textContent =
            "NGƯỜI CHƠI " +
            player +
            " THẮNG!";
    }
    turnText.textContent =
        "Kết thúc";
    message.textContent = "";
}
/* =========================
        UPDATE TURN
========================= */
function updateTurn() {
    if (currentPlayer === "X") {
        turnText.textContent =
            "Lượt: X";
    }
    else {
        if (gameMode === "ai") {
            turnText.textContent =
                "Lượt: AI";
        }
        else {
            turnText.textContent =
                "Lượt: O";
        }
    }
}
/* =========================
        CHECK WIN
========================= */
function checkWin(row, col, player) {
    const directions = [
        [1, 0],
        [0, 1],
        [1, 1],
        [1, -1]
    ];
    for (const direction of directions) {
        const dr = direction[0];
        const dc = direction[1];
        let count = 1;
        count += countDirection(
            row,
            col,
            dr,
            dc,
            player
        );
        count += countDirection(
            row,
            col,
            -dr,
            -dc,
            player
        );
        if (count >= 5) {
            return true;
        }
    }
    return false;
}
/* =========================
        COUNT DIRECTION
========================= */
function countDirection(
    row,
    col,
    dr,
    dc,
    player
) {
    let count = 0;
    let r = row + dr;
    let c = col + dc;
    while (
        r >= 0 &&
        r < SIZE &&
        c >= 0 &&
        c < SIZE &&
        board[r][c] === player
    ) {
        count++;
        r += dr;
        c += dc;
    }
    return count;
}
/* =========================
        CHECK DRAW
========================= */
function checkDraw() {
    for (let row = 0; row < SIZE; row++) {
        for (let col = 0; col < SIZE; col++) {
            if (board[row][col] === "") {
                return false;
            }
        }
    }
    return true;
}
/* =========================
        AI MOVE
========================= */
function aiMove() {
    if (gameOver) return;
    const move = findBestMove();
    makeMove(
        move.row,
        move.col,
        "O"
    );
}
/* =========================
        FIND BEST MOVE
========================= */
function findBestMove() {
    /*
        ƯU TIÊN 1:
        AI có thể thắng
    */
    for (
        let row = 0;
        row < SIZE;
        row++
    ) {
        for (
            let col = 0;
            col < SIZE;
            col++
        ) {
            if (board[row][col] === "") {
                board[row][col] = "O";
                if (
                    checkWin(
                        row,
                        col,
                        "O"
                    )
                ) {
                    board[row][col] = "";
                    return {
                        row: row,
                        col: col
                    };
                }
                board[row][col] = "";
            }
        }
    }
    /*
        ƯU TIÊN 2:
        CHẶN NGƯỜI CHƠI
        Nếu X chỉ cần đi một ô
        là thắng thì AI sẽ
        chiếm ô đó.
    */
    for (
        let row = 0;
        row < SIZE;
        row++
    ) {
        for (
            let col = 0;
            col < SIZE;
            col++
        ) {
            if (board[row][col] === "") {
                board[row][col] = "X";
                if (
                    checkWin(
                        row,
                        col,
                        "X"
                    )
                ) {
                    board[row][col] = "";
                    return {
                        row: row,
                        col: col
                    };
                }
                board[row][col] = "";
            }
        }
    }
    /*
        ƯU TIÊN 3:
        Đi gần các quân cờ
    */
    let bestMoves = [];
    let bestScore = -1;
    for (
        let row = 0;
        row < SIZE;
        row++
    ) {
        for (
            let col = 0;
            col < SIZE;
            col++
        ) {
            if (board[row][col] !== "") {
                continue;
            }
            let score = 0;
            /*
                Ưu tiên gần quân AI
            */
            score +=
                countNearby(
                    row,
                    col,
                    "O"
                ) * 3;
            /*
                Ưu tiên gần quân X
            */
            score +=
                countNearby(
                    row,
                    col,
                    "X"
                ) * 2;
            if (score > bestScore) {
                bestScore = score;
                bestMoves = [{
                    row: row,
                    col: col
                }];
            }
            else if (score === bestScore) {
                bestMoves.push({
                    row: row,
                    col: col
                });
            }
        }
    }
    /*
        Nếu bàn hoàn toàn trống:
        AI chọn trung tâm.
    */
    if (
        bestMoves.length ===
        SIZE * SIZE
    ) {
        return {
            row: 7,
            col: 7
        };
    }
    /*
        Chọn ngẫu nhiên
        trong những nước tốt nhất.
    */
    return bestMoves[
        Math.floor(
            Math.random() *
            bestMoves.length
        )
    ];
}
/* =========================
        COUNT NEARBY
========================= */
function countNearby(
    row,
    col,
    player
) {
    let count = 0;
    for (
        let dr = -1;
        dr <= 1;
        dr++
    ) {
        for (
            let dc = -1;
            dc <= 1;
            dc++
        ) {
            if (
                dr === 0 &&
                dc === 0
            ) {
                continue;
            }
            const r = row + dr;
            const c = col + dc;
            if (
                r >= 0 &&
                r < SIZE &&
                c >= 0 &&
                c < SIZE &&
                board[r][c] === player
            ) {
                count++;
            }
        }
    }
    return count;
}
/* =========================
        BACK TO MENU
========================= */
function backToMenu() {
    gameOver = true;
    game.style.display = "none";
    menu.style.display = "flex";
    result.style.display = "none";
    message.textContent = "";
}
</script>
</body>
</html>
